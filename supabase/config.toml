project_id = "beanstalk-dink"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
port = 54325
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
# Customers book as guests — no public sign-up. Admins are invited via Supabase dashboard.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
