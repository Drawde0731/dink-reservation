services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Live source — changes reflect without rebuild
      - .:/app
      # Keep container's node_modules, don't override with host's
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
